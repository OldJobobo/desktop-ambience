name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run host-independent checks
        run: ./scripts/check-contracts.sh
      - name: Validate release metadata
        if: github.ref_type != 'tag'
        run: ./scripts/release-check.sh
      - name: Validate tagged release
        if: github.ref_type == 'tag'
        run: ./scripts/release-check.sh --tagged
